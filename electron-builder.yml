appId: com.qink.note
productName: Qink
directories:
  output: dist
files:
  - out/**
  - build/icon.ico
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  artifactName: Qink-Setup-${version}.${ext}
portable:
  artifactName: Qink-Portable-${version}.${ext}
