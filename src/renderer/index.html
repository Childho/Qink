<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Qink</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
  </head>
  <body>
    <div id="note">
      <div class="goals">
        <div class="goal quarter ghost">这个季度，最重要的是______</div>

        <div class="task ghost"><span class="circle"></span><span class="text">今天要做的第一件事</span></div>
        <div class="task ghost"><span class="circle"></span><span class="text">点击空白处添加任务</span></div>
      </div>
